# Render Blueprint — Smart Box Delivery API
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: smart-box-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: npm install --prefix server && npm install --prefix client && node scripts/render-build.mjs
    startCommand: npm start --prefix server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CLIENT_URL
        value: https://anti-tamper.onrender.com
      - key: CLIENT_URLS
        value: https://anti-tamper.vercel.app,http://localhost:5173
      - key: PUBLIC_BASE_URL
        value: https://anti-tamper.onrender.com
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: EMAIL_ENABLED
        value: "true"
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: Smart Box Delivery
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MOMO_PAY_NUMBER
        sync: false
      - key: WHATSAPP_SUPPORT
        sync: false
